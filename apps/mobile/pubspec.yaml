name: wayday
description: Android-first Wayday shell and Today interface.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  maplibre_gl:
    path: third_party/maplibre_gl
  geolocator: 14.1.1
  crypto: 3.0.7
  http: ^1.6.0
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.16.2

  fake_async: 1.3.3
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/notices/nsi/
    - assets/notices/natural-earth/
    - assets/maps/pilot/
    - assets/maps/pilot/fonts/NotoSansRegular/
    - assets/maps/pilot/sprites/
    - assets/maps/pilot/notices/
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
