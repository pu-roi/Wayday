name: Publish selected website testing preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wayday-owner-website-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      WAYDAY_GATEWAY_URL: ${{ vars.WAYDAY_GATEWAY_URL }}
      WAYDAY_TEST_GATEWAY_URL: ${{ vars.WAYDAY_TEST_GATEWAY_URL }}
      WAYDAY_FIREBASE_APP_ID: ${{ vars.WAYDAY_FIREBASE_APP_ID }}
      WAYDAY_TEST_FIREBASE_APP_ID: ${{ vars.WAYDAY_TEST_FIREBASE_APP_ID }}
      WAYDAY_FIREBASE_PROJECT_ID: ${{ vars.WAYDAY_FIREBASE_PROJECT_ID }}
      WAYDAY_RECAPTCHA_SITE_KEY: ${{ vars.WAYDAY_RECAPTCHA_SITE_KEY }}
      WAYDAY_FIREBASE_API_KEY: ${{ secrets.WAYDAY_FIREBASE_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      GITHUB_OUTPUT_REPORT: ${{ runner.temp }}/website-preview-delivery.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original source, immutable APKs and compatible gateways; publish preview
        run: python tool/distribution/deliver_website_preview.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-preview-delivery
          path: ${{ runner.temp }}/website-preview-delivery.json
  website:
    needs: [preview]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refuse an obsolete website checkout
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: python tool/distribution/release.py latest --output apps/website/src/release-data.json
      - run: cp apps/website/src/release-data.json apps/website/public/release-status.json
      - run: npm ci && npm run build
        working-directory: apps/website
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/website/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the live website offers the selected APK
        run: |
          commit=$(python -c 'import json; print(json.load(open("docs/wayday/evidence/website-preview-authorization.json"))["selectedCandidate"]["commit"])')
          python tool/distribution/verify_website.py --url 'https://pu-roi.github.io/Wayday/' --commit "$commit"
