name: Deploy reviewed Wayday gateway
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: wayday-cloud-gateway
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.WAYDAY_GATEWAY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: public-cloud
    env:
      PROJECT: ${{ vars.WAYDAY_GOOGLE_CLOUD_PROJECT }}
      REGION: asia-southeast1
      RUNTIME_ACCOUNT: ${{ vars.WAYDAY_RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements-gateway.lock && python -m pytest services/api/tests/test_gateway.py services/api/tests/test_gateway_ledger.py services/api/tests/test_gateway_providers.py -q
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WAYDAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WAYDAY_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build and push the dedicated gateway image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          image="$REGION-docker.pkg.dev/$PROJECT/wayday/gateway:$GITHUB_SHA"
          docker build -f services/api/Dockerfile.gateway -t "$image" services/api
          docker push "$image"
          echo "GATEWAY_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: wayday-gateway
          project_id: ${{ env.PROJECT }}
          region: ${{ env.REGION }}
          image: ${{ env.GATEWAY_IMAGE }}
          flags: --min-instances=0 --max-instances=1 --concurrency=4 --cpu=1 --memory=512Mi --timeout=60s --cpu-throttling --allow-unauthenticated --service-account=${{ env.RUNTIME_ACCOUNT }}
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT }}
            WAYDAY_FIREBASE_APP_IDS=${{ vars.WAYDAY_FIREBASE_APP_ID }}
            WAYDAY_PUBLIC_LEDGER_DOCUMENT=${{ vars.WAYDAY_PUBLIC_LEDGER_DOCUMENT }}
          secrets: |
            GEMINI_API_KEY=${{ vars.WAYDAY_GEMINI_SECRET_VERSION }}
            GOOGLE_ROUTES_SERVER_API_KEY=${{ vars.WAYDAY_ROUTES_SECRET_VERSION }}
            GEOAPIFY_API_KEY=${{ vars.WAYDAY_GEOAPIFY_SECRET_VERSION }}
            LOCATIONIQ_API_KEY=${{ vars.WAYDAY_LOCATIONIQ_SECRET_VERSION }}
