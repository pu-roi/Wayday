name: Wayday checks and preview delivery
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wayday-delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
        working-directory: apps/website
      - run: npm audit --audit-level=high
        working-directory: apps/website
      - run: npm test && npm run build
        working-directory: apps/website
      - run: npx playwright install --with-deps chromium
        working-directory: apps/website
      - run: npm run test:browser
        working-directory: apps/website

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-gateway.lock
      - run: pip install -r services/api/requirements-gateway.lock && pip install -e 'services/api[test,import]'
      - run: python -m pytest services/api/tests tool/distribution -q
      - run: pip install pip-audit && pip-audit -r services/api/requirements-gateway.lock --progress-spinner off

  mobile:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install pinned Android build tools
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" && exit 0
            sleep 5
          done
          exit 1
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
        working-directory: apps/mobile
      - name: Verify sharing controls with the release feature enabled
        run: flutter test --no-pub --dart-define=WAYDAY_SHARING=true --dart-define=WAYDAY_GATEWAY_URL=https://sharing.example test/share_repository_test.dart test/share_views_test.dart test/share_trip_toolbar_test.dart
        working-directory: apps/mobile
      - name: Verify the actual public feature compilation profile without providers
        run: |
          python tool/distribution/release.py defines --fixture --output "$RUNNER_TEMP/profile-check.json"
          cd apps/mobile
          flutter test --no-pub tool/release_profile_check.dart --dart-define-from-file="$RUNNER_TEMP/profile-check.json"
      - name: Build a public release with disposable signing and no live configuration
        env:
          WAYDAY_RELEASE_STORE_PASSWORD: ci-disposable-only
          WAYDAY_RELEASE_KEY_PASSWORD: ci-disposable-only
          WAYDAY_RELEASE_KEY_ALIAS: ci-test
        run: |
          export WAYDAY_RELEASE_STORE_FILE="$RUNNER_TEMP/ci-signing.jks"
          keytool -genkeypair -keystore "$WAYDAY_RELEASE_STORE_FILE" -alias ci-test -storepass:env WAYDAY_RELEASE_STORE_PASSWORD -keypass:env WAYDAY_RELEASE_KEY_PASSWORD -dname 'CN=Disposable CI' -keyalg RSA -validity 2
          python tool/distribution/release.py defines --fixture --output "$RUNNER_TEMP/public-defines.json"
          cd apps/mobile
          flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/public-defines.json"
      - name: Verify minified Navigation reflection access
        run: python tool/distribution/check_navigation_reflection.py --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk --mapping apps/mobile/build/app/outputs/mapping/release/mapping.txt
      - name: Retain verification APK briefly; never publish it as a user download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-only-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  native:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Enable hardware acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            pwsh -NoProfile -File apps/mobile/tool/test-map.ps1 -DeviceId emulator-5554 -Target integration_test/planning_recovery_test.dart
            pwsh -NoProfile -File apps/mobile/tool/test-map.ps1 -DeviceId emulator-5554 -Target integration_test/clarification_cache_test.dart
            pwsh -NoProfile -File apps/mobile/tool/test-map.ps1 -DeviceId emulator-5554 -Target integration_test/errand_intelligence_test.dart
            pwsh -NoProfile -File apps/mobile/tool/test-map.ps1 -DeviceId emulator-5554 -Target integration_test/ui_cleanup_test.dart

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest==9.1.1 PyYAML==6.0.3
      - run: python -m pytest tool/distribution/test_release_coordination.py tool/distribution/test_deploy_gateway.py tool/distribution/test_delivery_workflow.py -q

  gateway:
    needs: [website, api, mobile, native, release-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WAYDAY_PUBLIC_RELEASE_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-gateway.yml
    secrets: inherit

  release-candidates:
    needs: [gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: public-release
    env:
      WAYDAY_GATEWAY_URL: ${{ vars.WAYDAY_GATEWAY_URL }}
      WAYDAY_TEST_GATEWAY_URL: ${{ vars.WAYDAY_TEST_GATEWAY_URL }}
      WAYDAY_FIREBASE_APP_ID: ${{ vars.WAYDAY_FIREBASE_APP_ID }}
      WAYDAY_TEST_FIREBASE_APP_ID: ${{ vars.WAYDAY_TEST_FIREBASE_APP_ID }}
      WAYDAY_FIREBASE_PROJECT_ID: ${{ vars.WAYDAY_FIREBASE_PROJECT_ID }}
      WAYDAY_RECAPTCHA_SITE_KEY: ${{ vars.WAYDAY_RECAPTCHA_SITE_KEY }}
      WAYDAY_FIREBASE_API_KEY: ${{ secrets.WAYDAY_FIREBASE_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      WAYDAY_RELEASE_STORE_PASSWORD: ${{ secrets.WAYDAY_RELEASE_STORE_PASSWORD }}
      WAYDAY_RELEASE_KEY_PASSWORD: ${{ secrets.WAYDAY_RELEASE_KEY_PASSWORD }}
      WAYDAY_RELEASE_KEY_ALIAS: ${{ secrets.WAYDAY_RELEASE_KEY_ALIAS }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Prepare original signing identity and check live gateways
        env:
          STORE_BASE64: ${{ secrets.WAYDAY_RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          python tool/distribution/release.py gateway --url "$WAYDAY_GATEWAY_URL"
          python tool/distribution/release.py gateway --url "$WAYDAY_TEST_GATEWAY_URL"
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wayday-release.jks"
          chmod 600 "$RUNNER_TEMP/wayday-release.jks"
          echo "WAYDAY_RELEASE_STORE_FILE=$RUNNER_TEMP/wayday-release.jks" >> "$GITHUB_ENV"
          certificate=$(keytool -list -v -keystore "$RUNNER_TEMP/wayday-release.jks" -alias "$WAYDAY_RELEASE_KEY_ALIAS" -storepass:env WAYDAY_RELEASE_STORE_PASSWORD | sed -n 's/.*SHA256: //p')
          echo "RELEASE_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          number=$(python tool/distribution/release.py number)
          echo "RELEASE_NUMBER=$number" >> "$GITHUB_ENV"
      - name: Build and verify matching public and test candidates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          for channel in public test; do
            python tool/distribution/release.py defines --channel "$channel" --output "$RUNNER_TEMP/$channel-defines.json"
            (cd apps/mobile && flutter pub get --enforce-lockfile && flutter build apk --release --target=lib/main.dart --build-name=0.1.0 --build-number="$RELEASE_NUMBER" --dart-define-from-file="$RUNNER_TEMP/$channel-defines.json")
            name=wayday.apk
            if [ "$channel" = test ]; then name=wayday-test.apk; fi
            cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/release/$name"
            python tool/distribution/check_navigation_reflection.py --apk "$RUNNER_TEMP/release/$name" --mapping apps/mobile/build/app/outputs/mapping/release/mapping.txt
            python tool/distribution/verify_apk.py --apk "$RUNNER_TEMP/release/$name" --channel "$channel" --number "$RELEASE_NUMBER" --commit "$GITHUB_SHA" --certificate "$RELEASE_CERTIFICATE" --output "$RUNNER_TEMP/release/$channel-verification.json"
          done
      - name: Retain verified candidates for qualification and publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidates
          path: ${{ runner.temp }}/release
          retention-days: 14
          overwrite: true

  publish-apk:
    needs: [release-candidates]
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
      actions: read
    env:
      WAYDAY_GATEWAY_URL: ${{ vars.WAYDAY_GATEWAY_URL }}
      WAYDAY_TEST_GATEWAY_URL: ${{ vars.WAYDAY_TEST_GATEWAY_URL }}
      WAYDAY_FIREBASE_APP_ID: ${{ vars.WAYDAY_FIREBASE_APP_ID }}
      WAYDAY_TEST_FIREBASE_APP_ID: ${{ vars.WAYDAY_TEST_FIREBASE_APP_ID }}
      WAYDAY_FIREBASE_PROJECT_ID: ${{ vars.WAYDAY_FIREBASE_PROJECT_ID }}
      WAYDAY_RECAPTCHA_SITE_KEY: ${{ vars.WAYDAY_RECAPTCHA_SITE_KEY }}
      WAYDAY_FIREBASE_API_KEY: ${{ secrets.WAYDAY_FIREBASE_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-candidates --dir "$RUNNER_TEMP/release"
      - name: Verify approved publication profile and publish complete immutable assets
        run: python tool/distribution/publish_release.py --directory "$RUNNER_TEMP/release"

  publish-website:
    needs: [publish-apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WAYDAY_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refuse an obsolete website checkout
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: python tool/distribution/release.py latest --output apps/website/src/release-data.json
      - run: cp apps/website/src/release-data.json apps/website/public/release-status.json
      - run: npm ci && npm run build
        working-directory: apps/website
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/website/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify published page, assets, release identity and download
        run: python tool/distribution/verify_website.py --url 'https://pu-roi.github.io/Wayday/' --commit "$GITHUB_SHA"
