name: Wayday checks and preview delivery
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
        working-directory: apps/website
      - run: npm audit --audit-level=high
        working-directory: apps/website
      - run: npm test && npm run build
        working-directory: apps/website
      - run: npx playwright install --with-deps chromium
        working-directory: apps/website
      - run: npm run test:browser
        working-directory: apps/website

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-gateway.lock
      - run: pip install -r services/api/requirements-gateway.lock && pip install -e 'services/api[test,import]'
      - run: python -m pytest services/api/tests tool/distribution/test_release.py -q
      - run: pip install pip-audit && pip-audit -r services/api/requirements-gateway.lock --progress-spinner off

  mobile:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install pinned Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
        working-directory: apps/mobile
      - name: Build a public release with disposable signing and no live configuration
        env:
          WAYDAY_RELEASE_STORE_PASSWORD: ci-disposable-only
          WAYDAY_RELEASE_KEY_PASSWORD: ci-disposable-only
          WAYDAY_RELEASE_KEY_ALIAS: ci-test
        run: |
          export WAYDAY_RELEASE_STORE_FILE="$RUNNER_TEMP/ci-signing.jks"
          keytool -genkeypair -keystore "$WAYDAY_RELEASE_STORE_FILE" -alias ci-test -storepass:env WAYDAY_RELEASE_STORE_PASSWORD -keypass:env WAYDAY_RELEASE_KEY_PASSWORD -dname 'CN=Disposable CI' -keyalg RSA -validity 2
          python tool/distribution/release.py defines --fixture --output "$RUNNER_TEMP/public-defines.json"
          cd apps/mobile
          flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/public-defines.json"
      - name: Verify minified Navigation reflection access
        run: python tool/distribution/check_navigation_reflection.py --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk --mapping apps/mobile/build/app/outputs/mapping/release/mapping.txt
      - name: Retain verification APK briefly; never publish it as a user download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-only-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  native:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Enable hardware acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            pwsh -NoProfile -File apps/mobile/tool/test-map.ps1 -DeviceId emulator-5554 -Target integration_test/planning_recovery_test.dart
            pwsh -NoProfile -File apps/mobile/tool/test-map.ps1 -DeviceId emulator-5554 -Target integration_test/clarification_cache_test.dart

  publish-apk:
    needs: [website, api, mobile, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WAYDAY_PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: public-release
    concurrency:
      group: wayday-public-apk
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      WAYDAY_GATEWAY_URL: ${{ vars.WAYDAY_GATEWAY_URL }}
      WAYDAY_FIREBASE_APP_ID: ${{ vars.WAYDAY_FIREBASE_APP_ID }}
      WAYDAY_FIREBASE_PROJECT_ID: ${{ vars.WAYDAY_FIREBASE_PROJECT_ID }}
      WAYDAY_RECAPTCHA_SITE_KEY: ${{ vars.WAYDAY_RECAPTCHA_SITE_KEY }}
      WAYDAY_FIREBASE_API_KEY: ${{ secrets.WAYDAY_FIREBASE_API_KEY }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      WAYDAY_RELEASE_STORE_PASSWORD: ${{ secrets.WAYDAY_RELEASE_STORE_PASSWORD }}
      WAYDAY_RELEASE_KEY_PASSWORD: ${{ secrets.WAYDAY_RELEASE_KEY_PASSWORD }}
      WAYDAY_RELEASE_KEY_ALIAS: ${{ secrets.WAYDAY_RELEASE_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Prepare and validate signing and public configuration
        env:
          STORE_BASE64: ${{ secrets.WAYDAY_RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wayday-release.jks"
          chmod 600 "$RUNNER_TEMP/wayday-release.jks"
          echo "WAYDAY_RELEASE_STORE_FILE=$RUNNER_TEMP/wayday-release.jks" >> "$GITHUB_ENV"
          certificate=$(keytool -list -v -keystore "$RUNNER_TEMP/wayday-release.jks" -alias "$WAYDAY_RELEASE_KEY_ALIAS" -storepass:env WAYDAY_RELEASE_STORE_PASSWORD | sed -n 's/.*SHA256: //p')
          python tool/distribution/release.py qualify --certificate "$certificate"
          echo "RELEASE_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          number=$(python tool/distribution/release.py number)
          export RELEASE_NUMBER="$number"
          echo "RELEASE_NUMBER=$number" >> "$GITHUB_ENV"
          python tool/distribution/release.py defines --output "$RUNNER_TEMP/public-defines.json"
          python tool/distribution/release.py latest --output "$RUNNER_TEMP/previous.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/previous.json")); assert p.get("versionCode",0)<int(os.environ["RELEASE_NUMBER"]), "A newer release already exists"'
      - run: flutter pub get --enforce-lockfile && flutter build apk --release --build-name=0.1.0 --build-number="$RELEASE_NUMBER" --dart-define-from-file="$RUNNER_TEMP/public-defines.json"
        working-directory: apps/mobile
      - name: Verify minified Navigation reflection access before publication
        run: python tool/distribution/check_navigation_reflection.py --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk --mapping apps/mobile/build/app/outputs/mapping/release/mapping.txt
      - name: Publish immutable development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/release/wayday.apk"
          python tool/distribution/release.py manifest --certificate "$RELEASE_CERTIFICATE" --apk "$RUNNER_TEMP/release/wayday.apk" --output "$RUNNER_TEMP/release/wayday-release.json"
          cd "$RUNNER_TEMP/release"
          sha256sum wayday.apk > wayday.apk.sha256
          printf 'Android development preview. Users approve installation and updates.\n\nSource commit: %s\n' "$GITHUB_SHA" > notes.md
          gh release create "dev-$RELEASE_NUMBER" wayday.apk wayday.apk.sha256 wayday-release.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Wayday development $RELEASE_NUMBER" --notes-file notes.md

  publish-website:
    needs: [website, api, mobile, native, publish-apk]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WAYDAY_PAGES_ENABLED == 'true' && needs.website.result == 'success' && needs.api.result == 'success' && needs.mobile.result == 'success' && needs.native.result == 'success' && (needs.publish-apk.result == 'success' || needs.publish-apk.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: wayday-public-website
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refuse an obsolete website checkout
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: python tool/distribution/release.py latest --output apps/website/src/release-data.json
      - run: npm ci && npm run build
        working-directory: apps/website
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/website/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
